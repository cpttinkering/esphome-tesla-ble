# Offline / local variant of dashboard.yml: components and library come from
# unpacked copies of both repositories (tesla_ble_local_path /
# tesla_ble_library_path in repository.yml) instead of GitHub.
#
# This package deliberately excludes esphome identity, API, and Wi-Fi credentials.
# ESPHome Device Builder owns those settings in each device's local configuration.
substitutions:
  vcsec_poll_interval: "10"
  infotainment_poll_interval_awake: "30"
  infotainment_poll_interval_active: "10"
  infotainment_sleep_timeout: "660"
  schedule_poll_interval: "1800"  # charge/departure schedules, seconds (0 = on connect only)
  schedule_slots: "5"             # JSON slot sensors per schedule type (0-16)

packages:
  # Source locations (tesla_ble_ref, repo and library URLs) live in repository.yml.
  repository: !include repository.yml
  board: !include board.yml
  library: !include library.local.yml
  common: !include common.yml
  project: !include project.yml
  client: !include client.yml

external_components: !include external_components.local.yml

logger:
  level: INFO

ota:
  - platform: esphome
    encryption:

# Same as CLI builds (base.yml): makes the Wi-Fi fallback AP usable.
captive_portal:

wifi:
  # Device Builder owns ssid/password; the package only ensures the fallback
  # AP exists so captive_portal has something to serve on (otherwise config
  # validation warns "no WiFi AP is configured"). Open hotspot named after
  # the device - set wifi.ap.password in the device YAML to secure it.
  ap: {}
